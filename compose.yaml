# AgendaSaúde — sobe API + PostgreSQL do zero:
#
#   cp .env.example .env          # uma vez: configuração local (fora do Git)
#   docker compose up -d --build
#
# docker compose ps            → os dois serviços "healthy"
# docker compose logs -f api   → logs da API
# docker compose down          → remove containers e rede; o volume (dados) fica
# docker compose down -v       → ... e apaga o volume: os dados somem

name: agendasaude

services:
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: agendasaude-api:local
    ports:
      - "${API_PORT:-8080}:8080"          # porta do seu PC : porta do container
    environment:
      DB_HOST: banco                      # nome do serviço = hostname na rede do Compose
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-agendasaude}
      DB_USER: ${POSTGRES_USER:-agendasaude}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (copie de .env.example)}
    depends_on:
      banco:
        condition: service_healthy        # só sobe quando o banco responde ao pg_isready
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  banco:
    image: postgres:17-alpine             # mesma imagem dos testes de integração (Testcontainers)
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendasaude}
      POSTGRES_USER: ${POSTGRES_USER:-agendasaude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (copie de .env.example)}
    volumes:
      - dados-postgres:/var/lib/postgresql/data   # o dado mora fora do container e sobrevive ao down
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do Compose, não pelo seu PC.
    # Para inspecionar: docker compose exec banco psql -U agendasaude agendasaude
    restart: unless-stopped

volumes:
  dados-postgres:                         # volume nomeado, gerenciado pelo Docker
